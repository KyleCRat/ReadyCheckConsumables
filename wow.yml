# Reviewed globals for RCC's Retail WoW environment, layered over Lua 5.1.
# Names do not validate API member signatures or secret-value contracts.
# API/UI names: local Blizzard export f54dee9, Retail 12.1.5.70448.
# Localized fallback strings: resource index 36dd01d, Retail 12.1.0.69587;
# that older index establishes names only, not current API availability.
base: lua51
globals:
    # RCC SavedVariables and slash-command registration; LibStub is embedded.
    ReadyCheckConsumablesDB:
        any: true
    ReadyCheckConsumablesCharacterDB:
        any: true
    SLASH_RCC1:
